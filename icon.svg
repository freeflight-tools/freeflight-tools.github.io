<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Free Flight Tools">
  <title>Free Flight Tools</title>
  <!-- FILLED, not stroked. The mark was a contour-line ridge in 3.4px and 2px
       strokes, and at a 16px favicon those land at 0.85px and 0.5px: it read as
       a faint blue squiggle, and the second ridge at opacity .5 was invisible.
       Rendered side by side at 16 / 24 / 32 / 64 / 128 before choosing this.

       Two solid peaks carry the shape at every size, and the palette is the
       family's own: near-white against the hero's #0B1218 is ~16:1, the second
       peak is the blue HX Call owns, and the sun is the amber Windmap owns. So
       both tools are in the mark without either one claiming it.

       The sun sits BEHIND the second peak on purpose. Free-floating it read as
       a notification badge in the corner at 16px; overlapping makes it part of
       a scene instead.

       rx is for browser tabs. iOS and Android mask their own corners, which is
       why icon-512.png stays square and full bleed. -->
  <rect width="64" height="64" rx="15" fill="#0B1218"/>
  <circle cx="48" cy="19" r="7" fill="#F0A24A"/>
  <path d="M30 50 L44 27 L61 50 Z" fill="#4E82AD"/>
  <path d="M2 50 L23 12 L44 50 Z" fill="#EAF1F7"/>
</svg>
